run_id: carla_ft
run_root_dir: /workspace/VLA4AD_Research/outputs/vlajepa_carla
seed: 42
trackers:
- json
- wandb
wandb_project: vla-jepa-carla
wandb_entity: null
is_debug: false
framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /workspace/VLA4AD_Research/outputs/models/Qwen3-VL-2B-Instruct
    # Aurora has no CUDA/flash-attn: use SDPA attention.
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    # Driving action = unicycle control [accel, curvature] (Alpamayo 1.5).
    action_dim: 2
    # Proprio state = ego speed (1-dim). Conditions the action head on current speed so
    # it can accelerate from a standstill instead of predicting the near-zero mean accel.
    state_dim: 1
    # chunk_len = future_action_window_size + 1 = 64 future controls (~6.4s @ 10Hz),
    # matching Alpamayo 1.5. This is both the model action chunk and the
    # dataloader action_horizon.
    future_action_window_size: 63
    action_horizon: 64
    past_action_window_size: 0
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: /workspace/VLA4AD_Research/outputs/models/vjepa2-vitl-fpc64-256
    depth: 12
    num_heads: 8
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8
  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /workspace/VLA4AD_Research/data/lerobot
    data_mix: carla_ego
    action_type: delta_pose
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from frames {actions} and produce the corresponding driving trajectory {e_actions}."
    resolution_size: 224   # VLM image input size
    # Global batch = per_device_batch_size * 12 tiles * grad_accum = 120.
    per_device_batch_size: 10
    video_resolution_size: 256
    load_all_data_for_training: true
    with_state: true
    # Driving data has no gripper/position columns, so disable pause-frame removal.
    delete_pause_frame: false
    # Keep every 12th frame as a sample start (~1.2s at 10Hz). Consecutive starts share
    # 63/64 of their action horizon, and this matches the ~1.2s event_t0s grid Alpamayo
    # samples on, so both models see comparably sized epochs (~190k samples).
    frame_stride: 12


trainer:
  # Train for a fixed number of epochs (matching Alpamayo 1.5 Stage 2's 3): max_train_steps
  # is derived from the dataloader length at startup and the value below is ignored.
  train_by_epochs: true
  epochs: 3
  max_train_steps: 30000
  num_warmup_steps: 500
  # Number of independent (noise level, noise) draws the flow-matching action head is
  # trained on per real sample. The VLM/V-JEPA forward runs once and its conditioning
  # tokens are repeated, so this costs N x the small DiT head only. Read from trainer.*,
  # NOT framework.action_model.* (where it was silently ignored, defaulting to 4).
  repeated_diffusion_steps: 4
  save_interval: 5000
  eval_interval: 100000
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'vj_encoder'
  # Stage-1 (world-model) checkpoint carries these three; action_model is excluded
  # because Stage 1 never trained it (wm_loss only) and it was saved at the old
  # action_dim=3, so a full load size-mismatches. The head trains from scratch here.
  reload_modules: 'vj_predictor,qwen_vl_interface,vj_encoder'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
