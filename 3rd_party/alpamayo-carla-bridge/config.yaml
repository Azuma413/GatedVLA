carla:
  host: "localhost"
  port: 2000
  timeout: 30
  world: "Town03"
  sync_mode: true
  fixed_delta: 0.1  # 10 Hz

vehicle:
  blueprint: "vehicle.tesla.model3"

cameras:
  resolution: [800, 600]
  front_wide:
    fov: 120
    x: 1.5
    y: 0.0
    z: 1.6
    pitch: 0
    yaw: 0
  front_left:
    fov: 70
    x: 1.5
    y: -0.3
    z: 1.6
    pitch: 0
    yaw: -30
  front_right:
    fov: 70
    x: 1.5
    y: 0.3
    z: 1.6
    pitch: 0
    yaw: 30
  front_tele:
    fov: 30
    x: 1.5
    y: 0.0
    z: 1.6
    pitch: 0
    yaw: 0

alpamayo:
  model_id: "nvidia/Alpamayo-R1-10B"
  device: "cpu"
  attn_implementation: "sdpa"
  num_traj_samples: 1

controller:
  lateral_pid: [1.0, 0.0, 0.1]       # P, I, D
  longitudinal_pid: [0.5, 0.0, 0.05]
  target_speed_kmh: 30
  max_throttle: 0.6
  max_brake: 0.8
  max_steer: 0.7

run:
  max_steps: 60

recording:
  enabled: true
  fps: 10
  video_width: 1920
  video_height: 1080
