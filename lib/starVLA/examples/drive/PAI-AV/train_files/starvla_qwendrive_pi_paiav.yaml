run_id: starvla_qwendrive_pi_paiav
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_drive
is_debug: false

# Qwen-Drive-1.0-4B (Qwen3.5-4B) VLM + pi-style layer-wise flow-matching action expert.
# Front camera only. Proprio / output follow DriveMoE DrivePi0:
#   state  (5, 10): ego history t-4..t @10Hz, per step
#                   [speed, accel_xyz, ang_vel_xyz, heading_rel, target_x, target_y] (current ego frame)
#   action (10, 2): ego-frame (x fwd, y lat) waypoints t+0..t+9 @10Hz, absolute in current frame
#   both q01/q99 min-max normalised to [-1, 1].
framework:
  name: QwenDrivePI
  qwenvl:
    base_vlm: Qwen/Qwen-Drive-1.0-4B
    attn_implementation: sdpa
  drive:
    prompt: predict trajectory
    current_image_pixels: 921600   # 1280x720 budget for the current front frame
    history_image_pixels: 174080   # 544x320 budget for history front frames
  action_model:
    action_dim: 2
    action_horizon: 10
    state_dim: 10
    state_horizon: 5
    num_inference_timesteps: 10
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      interleave_self_attention: true

datasets:
  vla_data:
    # TODO: PAI-AV front-camera dataloader (front_wide_120fov frames [t-1, t] + egomotion labels).
    data_root_dir: /lus/flare/projects/RobustViT/hiratsuka/datasets/PhysicalAI-Autonomous-Vehicles
    per_device_batch_size: 8

trainer:
  repeated_diffusion_steps: 4
  max_train_steps: 30000
  num_warmup_steps: 200
  save_interval: 5000
  eval_interval: 1000
  learning_rate:          # DriveMoE: 5e-5 for both VLM and action expert
    base: 5.0e-05
    qwen_vl_interface: 5.0e-05
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-08
  freeze_modules: ''
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
