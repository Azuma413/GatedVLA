run_id: starvla_qwendrive_pi_paiav_imgonly_std_h25
run_root_dir: /lus/flare/projects/RobustViT/hiratsuka/VLA4AD_Research/outputs/qwendrive_pi
seed: 42
use_wandb: true
wandb_entity: your_wandb_entity   # placeholder -> default entity of the API key
wandb_project: starVLA_drive

# Qwen-Drive-1.0-4B (Qwen3.5-4B) VLM + pi-style layer-wise flow-matching action expert, trained from Qwen-Drive.
# Image-only baseline: no target point, no speed, no ego state anywhere (prompt "predict trajectory", no DiT state
# tokens), so the trajectory can only come from the two front frames (t-0.1 s, t0).
#   action (25, 2): [acceleration, curvature] per 0.1 s step over 2.5 s; positions for eval are integrated from the
#                   recorded current speed (eval only, not an input).
# VLM hidden standardised per channel before the DiT projectors (drive.standardize_vl_hidden): without it the
# image tokens all reach the DiT as the same vector (massive-activation channels) and the image is unused.
# norm_stats / eval index: meta_h25_v2tp (the state statistics are unused).
framework:
  name: QwenDrivePI
  qwenvl:
    base_vlm: Qwen/Qwen-Drive-1.0-4B
    attn_implementation: sdpa
  drive:
    prompt: predict trajectory
    current_image_pixels: 921600   # 1280x720 budget for the current front frame
    history_image_pixels: 174080   # 544x320 budget for the history front frame (t-0.1 s)
    standardize_vl_hidden: true
  action_model:
    action_dim: 2
    action_horizon: 25             # controls for t0 -> t0 + 2.5 s @10 Hz
    state_dim: 0                   # no ego state / target tokens in the DiT
    state_horizon: 5
    num_inference_timesteps: 10
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      interleave_self_attention: true

datasets:
  vla_data:
    data_root: /lus/flare/projects/RobustViT/hiratsuka/datasets/PhysicalAI-Autonomous-Vehicles
    stats_path: /lus/flare/projects/RobustViT/hiratsuka/VLA4AD_Research/outputs/qwendrive_pi/meta_h25_v2tp/norm_stats.json
    eval_index_path: /lus/flare/projects/RobustViT/hiratsuka/VLA4AD_Research/outputs/qwendrive_pi/meta_h25_v2tp/eval_samples_val.json
    scene_index_path: /lus/flare/projects/RobustViT/hiratsuka/VLA4AD_Research/outputs/qwendrive_pi/meta_h25_v2tp/scene_samples_val.json   # figure-only scenes (prepare_scene_index.py)
    num_eval_samples: 240          # 80 left / 80 right / 80 straight (val split)
    target_distance: 25.0          # target point = first future ego position >= 25 m away
    state_mode: traj
    action_mode: unicycle
    state_target_point: true
    target_point_in_prompt: false
    speed_in_prompt: false
    per_device_batch_size: 4
    eval_batch_size: 4
    num_workers: 8
    prefetch_factor: 4
    worker_start_method: spawn

trainer:
  repeated_diffusion_steps: 4
  max_train_steps: 30000
  num_warmup_steps: 200
  logging_frequency: 10
  eval_interval: 1000
  eval_at_start: true
  num_eval_plots_per_class: 4
  save_interval: 5000
  keep_last_checkpoints: 2
  save_dtype: bfloat16
  learning_rate:          # DriveMoE: 5e-5 for both VLM and action expert
    base: 5.0e-05
    qwen_vl_interface: 5.0e-05
    action_model: 5.0e-05
  scheduler_specific_kwargs:
    min_lr: 1.0e-08
  freeze_modules: ''
  bf16: true
  max_grad_norm: 1.0
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-08
